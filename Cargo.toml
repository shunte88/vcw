# Virtual workspace root. The product lives in `crates/`, one crate per §6 group with
# §6's leaves as modules - see docs/adr/0003-workspace-layout.md for why the grouping
# stops there rather than going all the way down to ~35 crates.
#
# The Phase 0 spikes are a separate workspace under `spikes/`. They are finished
# evidence, not living code: excluding them keeps the product's CI matrix about the
# product, and a Linux-only job still compiles them so they cannot rot silently.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "VCW - The Vinyl Capture Workstation"
# MIT today. Becomes "MIT AND LGPL-2.1-or-later" when chromaprint-next lands in
# Phase 2 - see THIRD-PARTY-NOTICES.md and the relink obligation it documents.
license = "MIT"
repository = "https://github.com/shunte88/vcw"
authors = ["Stue Hunter"]

[workspace.dependencies]
# Internal. Versioned as well as pathed so the crates stay publishable if that ever
# becomes useful, and so a stale path cannot resolve to the wrong thing.
vcw-audio = { path = "crates/audio", version = "0.1.0" }
vcw-core = { path = "crates/core", version = "0.1.0" }
vcw-export = { path = "crates/export", version = "0.1.0" }
vcw-fingerprint = { path = "crates/fingerprint", version = "0.1.0" }
vcw-identify = { path = "crates/identify", version = "0.1.0" }
vcw-metadata = { path = "crates/metadata", version = "0.1.0" }
vcw-project = { path = "crates/project", version = "0.1.0" }
vcw-signal = { path = "crates/signal", version = "0.1.0" }
vcw-types = { path = "crates/types", version = "0.1.0" }

# External. Single source of version truth for the whole tree; a bump happens here
# and nowhere else.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
# The FLAC encoder behind `vcw export --format flac` (D5). Pure Rust and
# Apache-2.0, so no C library to relink and nothing new for the licence
# allowlist; WAV is our own writer because a RIFF header is thirty lines and
# every crate that writes one has an opinion about 24-bit that we do not share.
flacenc = { version = "0.5", default-features = false }
# 0.18.2 or newer is a hard floor, not a preference: 0.16 mis-reported ALSA formats
# and could not select a device by PCM id. See docs/spikes/S1-cpal-capture.md.
cpal = "0.18.2"
rusqlite = { version = "0.40", features = ["bundled"] }
# The bounded lock-free SPSC ring behind the capture callback (§10). Proven in S1
# and S2 at 24/192 for 90 minutes; wait-free on both ends, which is the property
# the audio thread needs and a mutex cannot give it.
rtrb = "0.4"
# The FFT behind spectral flatness (§22). Chosen to match VRipr's detector exactly:
# the port has to agree with it numerically, and swapping in a real-input transform
# would have made every parity difference an argument about arithmetic order.
rustfft = "6"
# Tag and artwork writing (§33). The same library VRipr tagged with, which
# matters: the tags a player reads out of a VCW export should be the tags it read
# out of a VRipr one. MIT OR Apache-2.0, MSRV 1.89.
lofty = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
# The blocking HTTP client behind the `net` feature of vcw-metadata (§40). Blocking
# because VCW has no async runtime and is not getting one for two REST APIs; rustls
# rather than native-tls so a Windows build needs no OpenSSL and the license
# allowlist in deny.toml already covers it.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Enforced as errors in CI (`clippy --all-targets -- -D warnings`), warnings locally.
# `missing_docs` is deliberate: a scaffold whose modules do not say what they are for
# and which work package fills them is just empty directories.
[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
dbg_macro = "warn"

[profile.release]
opt-level = 3
lto = true
debug = 1
