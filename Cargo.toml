# Virtual workspace root. The product lives in `crates/`, one crate per §6 group with
# §6's leaves as modules - see docs/adr/0003-workspace-layout.md for why the grouping
# stops there rather than going all the way down to ~35 crates.
#
# The Tauri shell is a separate workspace under `app/`, for the same reason and one
# more: WP-15's exit criterion is that no core crate depends on Tauri, and the
# `core-is-ui-free` job proves it by walking this workspace's whole tree. A shell
# inside it would put Tauri there by construction. See `app/Cargo.toml`.
#
# The Phase 0 spikes are a separate workspace under `spikes/`. They are finished
# evidence, not living code: excluding them keeps the product's CI matrix about the
# product, and a Linux-only job still compiles them so they cannot rot silently.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["app", "spikes"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.90"
description = "VCW - The Vinyl Capture Workstation"
# VCW's own code is MIT. A built binary is "MIT AND LGPL-2.1-or-later AND
# LGPL-3.0" as of WP-21 (chromaprint-next) and WP-25 (libmp3lame) - see
# THIRD-PARTY-NOTICES.md and the relink obligation it documents, and the About
# dialog, which derives what *this* build links from the cargo features.
license = "MIT"
repository = "https://github.com/shunte88/vcw"
authors = ["Stue Hunter"]

# What the project *is*, in one sentence, as the repository's own description
# says it. `description` above is the product's name, which is what crates.io
# wants and what the About dialog titles itself with; this is the sentence under
# it. Here rather than typed into the dialog for the reason every other fact in
# that dialog is derived - see `About::current` - and read by
# `the_description_is_what_the_project_says_it_is`.
[workspace.metadata.vcw]
description = "VCW the de facto tool for vinyl capture across platforms: a complete workstation for listeners preserving and cataloging their collections, with reusable services for people building their own workflows and interfaces"

[workspace.dependencies]
# Internal. Versioned as well as pathed so the crates stay publishable if that ever
# becomes useful, and so a stale path cannot resolve to the wrong thing.
vcw-audio = { path = "crates/audio", version = "0.2.1" }
vcw-contract = { path = "crates/contract", version = "0.2.1" }
vcw-core = { path = "crates/core", version = "0.2.1" }
vcw-export = { path = "crates/export", version = "0.2.1" }
vcw-fingerprint = { path = "crates/fingerprint", version = "0.2.1" }
vcw-identify = { path = "crates/identify", version = "0.2.1" }
vcw-i18n = { path = "crates/i18n", version = "0.2.1" }
vcw-import = { path = "crates/import", version = "0.2.1" }
vcw-metadata = { path = "crates/metadata", version = "0.2.1" }
vcw-project = { path = "crates/project", version = "0.2.1" }
vcw-signal = { path = "crates/signal", version = "0.2.1" }
vcw-types = { path = "crates/types", version = "0.2.1" }

# External. Single source of version truth for the whole tree; a bump happens here
# and nowhere else.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
# The FLAC encoder behind `vcw export --format flac` (D5). Pure Rust and
# MIT OR Apache-2.0, so no C library to relink and nothing new for the license
# allowlist; WAV is our own writer because a RIFF header is thirty lines and
# every crate that writes one has an opinion about 24-bit that we do not share.
#
# This was `flacenc` 0.5 until 2026-10-06. That crate stops at 24 bits and
# 96 kHz, which refused a default capture outright: a device negotiation takes
# the widest integer format on offer, so an ordinary rip is `Int32` and had no
# FLAC path at all. `flac-codec` takes 1 to 32 bits and rates to 2^20, verified
# against reference libFLAC, and writes within 0.08% of `flac -8` on real
# material. No default features: `rayon`, `cpal` and `rubato` are all optional
# and none of them belongs in an export thread.
flac-codec = { version = "1.3", default-features = false }
# MP3, behind `vcw-export/mp3` (D5, WP-25). High-level bindings over libmp3lame,
# whose C source `mp3lame-sys` vendors and builds - so there is no system library
# to find on any of the four targets, and the relink obligation in
# THIRD-PARTY-NOTICES.md is ours to honor. The crate declares **LGPL-3.0**, not
# the LGPL-2.1 D5 assumed, which is why `deny.toml` names a version of the
# license the chromaprint-next exception does not cover.
mp3lame-encoder = { version = "0.2", features = ["std"] }
# Ogg Vorbis, behind `vcw-export/ogg` (D5, WP-25). Bindings over aoTuV-Lancer, a
# tuned libvorbis, and libogg. **BSD-3-Clause** - D5 recorded this one as LGPL and
# it is not, so Ogg export adds no copyleft obligation at all and nothing to
# `deny.toml`'s exception list.
vorbis_rs = "0.5"
# Chromaprint, behind `vcw-fingerprint` (§25, WP-21). Pure Rust, which is the whole
# point: §25 forbids an external fpcalc, a subprocess and a temporary WAV, and this
# crate takes `&[i16]` straight off the capture tap. **LGPL-2.1-or-later**, so it is
# the second relink obligation in the binary after libmp3lame and `deny.toml` names
# it. The released crate is the dependency of record - the local checkout at
# /data2/chromaprint-next sits two SIMD commits ahead and was verified
# fingerprint-neutral out of tree rather than patched in. See
# docs/spikes/S4-chromaprint-streaming.md.
chromaprint-next = "0.1"
# 0.18.2 or newer is a hard floor, not a preference: 0.16 mis-reported ALSA formats
# and could not select a device by PCM id. See docs/spikes/S1-cpal-capture.md.
cpal = "0.18.2"
rusqlite = { version = "0.40", features = ["bundled"] }
# The bounded lock-free SPSC ring behind the capture callback (§10). Proven in S1
# and S2 at 24/192 for 90 minutes; wait-free on both ends, which is the property
# the audio thread needs and a mutex cannot give it.
rtrb = "0.4"
# The FFT behind spectral flatness (§22). Chosen to match VRipr's detector exactly:
# the port has to agree with it numerically, and swapping in a real-input transform
# would have made every parity difference an argument about arithmetic order.
rustfft = "6"
# Tag and artwork writing (§33). The same library VRipr tagged with, which
# matters: the tags a player reads out of a VCW export should be the tags it read
# out of a VRipr one. MIT OR Apache-2.0, MSRV 1.89.
lofty = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
# The catalog format, and the one dependency i18n needs. Already in this tree as
# `toml_edit` and friends; the top-level reader is what was missing. Hand-rolling
# one was the alternative, and a translation file is submitted by a stranger -
# which makes its parser a trust boundary and not a place to save a dependency.
toml = "1"
# §42's structured logging. The libraries take the facade only: an event costs a
# relaxed load and a branch when nothing has installed a subscriber, which is what
# makes it acceptable to leave events in code the capture path calls into. The
# binaries install the subscriber, and nothing else does - a library that
# configures logging has taken a decision that belongs to whoever runs it.
tracing = "0.1"
# `env-filter` earns the regex it pulls in: per-target filtering is the whole
# point of a log when diagnosing somebody else's machine, and "run it again with
# VCW_LOG=vcw_audio=trace" is a far better instruction than "turn everything on".
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# D9's half of the Rust/TypeScript contract: the TS declarations in
# `app/ui/src/bindings/` are generated from the `vcw-contract` types by a test,
# and a drift check fails the build when the two disagree. Derive-only and
# permissive, with no runtime of its own - the whole tree it adds is syn, quote
# and thiserror, all of which were already here.
ts-rs = "12"
# The blocking HTTP client behind the `net` feature of vcw-metadata (§40). Blocking
# because VCW has no async runtime and is not getting one for two REST APIs; rustls
# rather than native-tls so a Windows build needs no OpenSSL and the license
# allowlist in deny.toml already covers it.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Enforced as errors in CI (`clippy --all-targets -- -D warnings`), warnings locally.
# `missing_docs` is deliberate: a scaffold whose modules do not say what they are for
# and which work package fills them is just empty directories.
[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
dbg_macro = "warn"

[profile.release]
opt-level = 3
lto = true
debug = 1

# The CLI as it ships beside the shell in a package. Release, minus the debug
# sections: the same trade `app/Cargo.toml` documents, in a separate profile so
# a local `cargo build --release` keeps its line numbers for the soak.
[profile.ship]
inherits = "release"
debug = 0
strip = "debuginfo"
