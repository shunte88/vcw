[package]
name = "vcw-project"
description = "The .vcw single-file SQLite project: schema, persistence and recovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vcw-types = { workspace = true }
# The waveform reader folds stored triplets with `vcw_signal::waveform`. Allowed
# by ADR-0003: the rule is that analysis must not reach a device and that only
# this crate opens the project, and `vcw-signal` depends on `vcw-types` alone.
vcw-signal = { workspace = true }
crc32fast = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
