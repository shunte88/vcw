[package]
name = "vcw-metadata"
description = "Discogs, MusicBrainz and AcoustID providers, genre normalization and artwork"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vcw-types = { workspace = true }
crc32fast = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

# `net` is on by default and off in a build that must not be able to reach a
# network. This is §40's offline mode taken literally: without the feature the HTTP
# transport does not exist, so no call site can accidentally make a request, and
# `cargo check -p vcw-metadata --no-default-features` is a gate leg that proves it.
[features]
default = ["net"]
net = ["dep:ureq"]

[lints]
workspace = true
