[package]
name = "vcw-cli"
description = "Headless driver for the VCW core - the whole application without a UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "vcw"
path = "src/main.rs"

[dependencies]
vcw-core = { workspace = true }
vcw-signal = { workspace = true }
vcw-fingerprint = { workspace = true }
vcw-audio = { workspace = true }
vcw-metadata = { workspace = true }
vcw-export = { workspace = true }
vcw-i18n = { workspace = true }
vcw-import = { workspace = true }
vcw-project = { workspace = true }
vcw-serve = { workspace = true, optional = true }
vcw-types = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# §52: "`serve` shall be a packaging-time feature that can be built out, and
# shall be off unless the verb is invoked. A capture-only install shall not be
# listening on anything." On by default because the headless deployment is the
# one that wants it and a feature nobody enables is a feature nobody has;
# `--no-default-features` leaves a `vcw` with no listener in it at all, which
# is what a distribution packaging the CLI for capture only would build. The
# gate builds both.
default = ["serve"]
serve = ["dep:vcw-serve"]

[dev-dependencies]
rusqlite = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
