# VCW playback equalization curves (§51).
#
# MIT License - see the header in any Rust source file for the full text.
#
# WHAT A CURVE IS. Three time constants, in microseconds, naming the corners of the
# replay network: t1 the bass shelf, t2 the bass turnover, t3 the treble rolloff. The
# replay response is
#
#     H(s) = (1 + s*t2) / ((1 + s*t1) * (1 + s*t3))      0 dB at 1 kHz
#
# Omit a field and that network is absent. Omit all three and the curve is flat.
#
# WHY TIME CONSTANTS AND NOT DECIBELS. Every secondary chart also publishes a "dB at
# 10 kHz" figure, and in most of them that figure describes the treble section alone
# rather than the finished curve: Columbia LP is published as "-16" and measures
# -15.54 dB against 1 kHz. NAB additionally puts its 0 dB reference at 700 Hz, which
# shifts every value in a NAB table by 1.49 dB. And a trailing "-0" in a code means
# there is no treble network at all, not 0 dB at 10 kHz. The time constants are the
# definition; the conformance test measures against them and against nothing else.
# docs/design/WP-29-playback-equalization.md has the working.
#
# THE CODE, e.g. 500R-13.7. Bass turnover in Hz, then a letter giving the *player's*
# maximum bass boost, then the treble section's dB at 10 kHz. The letters are
# N = no shelf, X = +12 dB, C = +14, A = +16, B = +18, R = +20. Kept here because it
# cross-checks t1: the letter predicts t1 = t2 * 10^(dB/20), and it agrees with the
# published shelf to 0.02 dB on every curve that has one.
#
# A CURVE WITH NO SHELF STILL NEEDS ONE ON REPLAY. An N type record was cut with no
# bass limit, so its replay curve has a pole at DC and rises without bound: +69 dB at
# 0.1 Hz and climbing, which turns any DC offset in a capture into an integrator that
# runs to the clipping point. Period players solved this with a shelf, which is what
# the letters are describing. `replay_shelf_db` is that limit, default +20 dB, and it
# is a property of the player and not of the record.
#
# ADDING YOUR OWN. Copy an entry, change the numbers, drop the file in the VCW
# configuration directory as `curves.toml`. An id already used here replaces the
# built-in one. `citation` is required: a curve nobody can trace is a curve nobody
# can check.

# ---------------------------------------------------------------------------
# No equalization.
# ---------------------------------------------------------------------------
[[curve]]
id       = "flat"
name     = "Flat (no curve)"
citation = "not a characteristic: the audio is passed through unchanged"

# ---------------------------------------------------------------------------
# The standard, and the two it was assembled from.
# ---------------------------------------------------------------------------
[[curve]]
id          = "riaa"
name        = "RIAA"
code        = "500R-13.7"
shelf_us    = 3180
turnover_us = 318
treble_us   = 75
citation    = "IEC 98 (1964); BS 1928:1955; adopted by the RIAA in 1952 from RCA's New Orthophonic characteristic"
era         = "August 1952 onward, universal from the late 1960s"
labels      = "effectively every label after the mid-1950s"
# The only curve whose published -13.7 dB at 10 kHz is a whole-curve figure. The
# implementation measures -13.73 dB and +19.27 dB at 20 Hz, against a published
# +19.274. It is the one curve where a secondary table can be used as a check.

[[curve]]
id          = "nab"
name        = "NAB / NARTB"
code        = "500B-16"
shelf_us    = 3180
turnover_us = 318
treble_us   = 100
citation    = "Galo, 'The Columbia Lp Equalization Curve', ARSC Journal, Spring 2009, p. 9; identical to the Quad 22 controller's B curve"
era         = "April 1949 to 1958"
labels      = "most American labels before RIAA"
# The B here is Quad's curve label, not the +18 dB shelf letter: the shelf is 3180 us,
# which is +20 dB. NAB referenced its published graph to 700 Hz rather than 1 kHz, so
# every figure in an NAB table reads 1.49 dB away from a 1 kHz one. Pspatial Audio:
# "NAB's decision to put the 0dB reference at 700Hz rather than 1kHz confuses everyone".

[[curve]]
id          = "columbia_lp"
name        = "Columbia LP"
code        = "500C-16"
shelf_us    = 1590
turnover_us = 318
treble_us   = 100
citation    = "Galo, 'The Columbia Lp Equalization Curve', ARSC Journal, Spring 2009 - circuit simulation of candidate time constants against the published Snepvangers graph, sub-0.3 dB fit"
era         = "June 1948 to 1956"
labels      = "Columbia; also HMV 33s cut in England after July 1953, Vanguard, Bach Guild, Cetra, Vox"
disputed    = "shelf_us: Pspatial Audio gives 1950 us, which differs by 1.68 dB at 20 Hz"
# The most contested curve in the literature, and the code settles it. 500C-16 means a
# +14 dB player shelf, which predicts t1 = 318 * 10^(14/20) = 1593.8 us. Galo's 1590
# is that to 0.02 dB. Pspatial's 1950 would be +15.75 dB, which is not a letter in the
# table. Columbia is the NAB curve with the shelf moved, which is the origin of the
# term "500 modified" or 500M in older equalization guides.

