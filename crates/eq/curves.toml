[[curve]]
id          = "aes"
name        = "AES"
code        = "400N-12.3"
turnover_us = 398
treble_us   = 63.7
citation    = "Audio Engineering Society curve, 1951; Audacity published table, 'Playback equalization for 78 rpm shellacs and early 33 1/3 LPs'"
era         = "January 1951 to 1958"
labels      = "American independents"

[[curve]]
id          = "teldec"
name        = "Teldec"
code        = "500R-11"
shelf_us    = 3180
turnover_us = 318
treble_us   = 50
citation    = "CCIR Recommendation 208 (1956), which replaced Rec. 134 of 1953; DIN 45533, 45536 and 45537 (1959)"
era         = "proposed 1957, in use to about 1962"
labels      = "Telefunken; German and European labels that did not take RIAA immediately"
# RIAA with the third constant changed from 75 us to 50 us, and nothing else. Sources
# disagree on how widely it was cut: Pspatial Audio has Telefunken using the CCIR
# characteristic until 1962, while a Vinyl Engine thread holds the DIN standard was a
# proposal never put into practice and that Teldec itself cut RIAA.

[[curve]]
id               = "emi"
name             = "EMI / HMV (Blumlein 300-0)"
code             = "300N-0"
turnover_us      = 531
replay_shelf_db  = 20.0
citation         = "Langford-Smith, Radiotron Designer's Handbook, 4th ed. 1952, compared against Moir, High Quality Sound Reproduction, 1958, Table 7.4; Copeland, Manual of Analogue Sound Restoration Techniques, British Library 2008"
era              = "1931 to July 1953, and on EMI 78s in Britain until the 1960s"
labels           = "EMI, His Master's Voice, British Columbia, Parlophone, MGM"
# EMI and HMV are one curve, which is the finding that resolves the entry secondary
# charts scatter between 200, 250, 300 and 500 Hz. Blumlein's original constant-
# amplitude-below-300-Hz characteristic, with no treble pre-emphasis at all: Pspatial
# Audio matched Langford-Smith's EMI curve against Moir's tabulated HMV 78 data, and
# Copeland extends it to EMI LPs and 45s up to mid-July 1953. After that date HMV 33s
# cut in England used `columbia_lp`, so HMV is two curves separated by a date.

[[curve]]
id              = "decca_ffrr_78"
name            = "Decca FFRR (78)"
code            = "250N-5.5"
turnover_us     = 636
treble_us       = 25
replay_shelf_db = 20.0
citation        = "Moir, High Quality Sound Reproduction, 1958, Table 7.4 and its de-emphasis circuit, SPICE-verified by Pspatial Audio"
era             = "1944 to 1956"
labels          = "Decca ffrr, London ffrr"
# Decca is the other §51 entry that is not one curve: this is the 78, and `decca_lp`
# is the microgroove. The widely cited third Decca curve, "640 us / 53 us with a 3 dB
# per octave slope", is a misreading - those frequencies are where the published graph
# departs from flat, not time constants. Pspatial Audio: "the indicated frequencies
# are not related to the time constants". 25 us gives -5.55 dB at 10 kHz, which is the
# 5.5 in the curve's own name to within 0.05 dB.

[[curve]]
id          = "decca_lp"
name        = "Decca LP"
code        = "500C-11.5"
shelf_us    = 1590
turnover_us = 318
treble_us   = 60
citation    = "Moir, High Quality Sound Reproduction, 1958, Table 7.4; time constants determined by Pspatial Audio"
era         = "June 1950 to 1955"
labels      = "Decca UK"
# Decca LPs pressed before June 1950 used `decca_ffrr_78`.

