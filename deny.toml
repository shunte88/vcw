# cargo-deny configuration (D7).
#
# The point of this file is licence drift: VCW's own code is MIT, and the moment a
# dependency bump pulls in something copyleft the binaries' obligations change
# without anyone noticing. CI fails the build instead.
#
# Run locally with: cargo deny check

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0436: `paste` is unmaintained and archived. It is not a
    # vulnerability and there is no safe upgrade - the author has retired the
    # crate rather than patched it.
    #
    # It reaches us through `lofty`, WP-14's tagger, and it is a **proc macro**:
    # it runs at build time, emits identifiers, and no line of it is linked into
    # the binary or executes at run time. So the exposure is that a build-time
    # dependency will not receive fixes, and `paste` has had no CVE to fix in its
    # lifetime; `pastey` is the drop-in fork if one is ever needed, and that is
    # lofty's call to make, not ours.
    #
    # Reviewed rather than silenced: if this is still here when lofty next moves,
    # check whether the dependency has gone with it and delete this entry.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Permissive, attribution-only licences. Anything outside this list is a decision,
# not an accident, and has to be added here with a reason.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

# Weak-copyleft dependencies, named one at a time. Every entry here is a decision
# with an obligation attached, written up in THIRD-PARTY-NOTICES.md; an exception
# without a corresponding section in that file is a bug in one of the two.

# MP3 (D5, WP-25). `mp3lame-encoder` is the safe wrapper and `mp3lame-sys` vendors
# and builds libmp3lame's C; both crates declare `LGPL-3.0`, which SPDX deprecated
# in favour of `LGPL-3.0-only` - cargo-deny warns about the spelling and matches it
# anyway, and correcting it is upstream's call rather than ours.
#
# Note that this is *not* the licence libmp3lame itself carries. The bundled
# `lame-3.100/COPYING` is the GNU Library GPL version 2, "or any later version",
# and the wrapper's LGPL-3.0 is the exercise of that option. The stricter of the
# two is the one that governs what we ship, which is why the tree carries
# LICENSE-LGPL-3.0 and LICENSE-GPL-3.0.
#
# Reachable only through `vcw-export`'s `mp3` feature. It is on by default because
# §33 requires MP3 export, and it is a feature so that a redistributor who cannot
# carry this obligation can drop it without forking: `--no-default-features
# --features ogg`.
#
# Ogg Vorbis needs no entry. `vorbis_rs`, `aotuv_lancer_vorbis_sys` and
# `ogg_next_sys` are all BSD-3-Clause, which the allowlist above already covers -
# D5 recorded Ogg as LGPL and that was wrong.
[[licenses.exceptions]]
name = "mp3lame-encoder"
allow = ["LGPL-3.0"]

[[licenses.exceptions]]
name = "mp3lame-sys"
allow = ["LGPL-3.0"]

# The third, and the one Phase 2 was holding this spot for: WP-21 put
# chromaprint-next in the graph, so §25's fingerprinting adds a second relink
# obligation beside libmp3lame's. Unlike the encoders it is behind no cargo
# feature, because §25 is not optional and there is no second fingerprinter to
# fall back to - a build without it could not identify anything.
[[licenses.exceptions]]
name = "chromaprint-next"
allow = ["LGPL-2.1-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
