<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340"><rect width="1200" height="340" fill="#f5f7f7"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#142a30}.title{font-size:25px;font-weight:bold}.body{font-size:21px}.small{font-size:18px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#257879"/></marker></defs><text x="40" y="45" class="title">Two facts determine the playback correction</text>
<rect x="40" y="75" width="475" height="100" rx="9" fill="#dfebeb"/><text x="60" y="110" class="body">1  What did the input chain do?</text><text x="60" y="148" class="small">RIAA / flat / unknown — per capture</text>
<rect x="40" y="200" width="475" height="100" rx="9" fill="#e9e1cc"/><text x="60" y="237" class="body">2  What curve does the record need?</text><text x="60" y="274" class="small">Release → side override → track override</text>
<path d="M520 125H580V190H650M520 250H580V190" fill="none" stroke="#257879" stroke-width="4"/><path d="M580 190H650" stroke="#257879" stroke-width="4" marker-end="url(#a)"/>
<text x="685" y="125" class="body">VCW resolves the correction</text><text x="685" y="166" class="small">Known chain: compensate as required</text><text x="685" y="203" class="small">Unknown chain: no guessed correction</text><text x="685" y="263" class="small">Stored capture remains unchanged</text></svg>