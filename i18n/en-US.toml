["settings.narrow.refuse"]
text = "Refuse (export as WAV instead)"

["settings.narrow.to"]
text = "Narrow to"

["settings.narrow.width.hint"]
text = """
24-bit is the archival answer: an `f32` sample carries a 24-bit significand, \
so that is the width at which a sample at full scale arrives intact, and it \
is also the width at which FLAC can still code one channel against the other. \
32-bit adds no resolution to any single sample and does keep the float's \
scale, which matters on a capture with very quiet passages."""

["settings.narrowing"]
text = "32-bit float captures"

["settings.narrowing.hint"]
text = """
FLAC is an integer codec, so a `f32` capture has to be brought down to whole \
numbers before it has a FLAC path. VCW does that at 24 bits with a triangular \
dither unless you say otherwise, which is the answer below; choose *Refuse* \
and it will ask instead, by refusing the export and naming the containers \
that would have taken the capture as it is. Nothing here touches the capture: \
it is read as it was recorded every time."""

