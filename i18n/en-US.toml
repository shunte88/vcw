["settings.genre"]
text = "Genre map"

["settings.genre.hint"]
text = """
What a provider calls a genre is not what your catalog calls one: Discogs \
answers `Electronic` with a style of `Dub Techno`, and a 1994 pressing \
carries whatever its cataloger typed. The genre map folds those into your own \
names before they are stored or written to a tag. Leave it empty for the \
built-in table - 639 mappings ported from VRipr - or give the path to a file \
of `key|Genre; Another` lines, one per row, `#` for a comment. Matching is \
exact first and case-insensitive second, and a genre the table does not \
mention passes through unchanged."""

