["settings.dither"]
text = "Dither"

["settings.dither.hint"]
text = """
Triangular dither trades about 5 dB of noise floor - at 24 bits, some 120 dB \
below full scale and well under the surface noise of any record - for a \
rounding error that is noise rather than distortion. Headroom is attenuation \
applied before rounding: nothing clips in floating point, so a capture \
peaking above 0 dBFS is rounded to the ceiling unless you leave it room."""

