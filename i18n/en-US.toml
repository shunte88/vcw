["settings.discogs.hint"]
text = """
Discogs needs a personal access token, which is a secret: §39 keeps it out of \
every project and settings file, so there is no field for it here. Export it \
before starting VCW and the line above says whether it arrived - a desktop \
launcher starts VCW with its own environment rather than your shell's, which \
is the usual reason a token you have exported reads as not set. Generating \
one takes a Discogs account and no application review."""

