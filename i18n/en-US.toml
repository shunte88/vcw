["settings.contact"]
text = "Contact address for the user agent"

["settings.contact.hint"]
text = """
MusicBrainz needs no account, but it does ask who is calling: an address here \
is sent in the user agent on every request, and without one the rate limit is \
harder and a lookup can be refused outright. An email address or a URL, and \
public by design - it is not a secret, so unlike the token below it can live \
in settings. `VCW_CONTACT` in the environment is used when this is empty."""

["settings.contact.unset"]
text = "unset - VCW_CONTACT, or nothing"

["settings.counted"]
text = "Counted"

["settings.counted.disc"]
text = "Across the disc (01..0n)"

["settings.counted.hint"]
text = """
Sides A and B are disc 1, C and D are disc 2, so a sequence restarts at the \
next record rather than running to the end of a box set - which is also what \
a track number tag means. *Label* leaves `{side}` as a letter; either number \
form makes it a number too, so `{side}-{tracknum}` reads `01-01` rather than \
`A-01`."""

["settings.counted.side"]
text = "Per side (01 again on side B)"

["settings.credentials.environment"]
text = """
Read once, when VCW starts, from the environment of whatever started it - \
which is why a credential you have exported can read as not set here. A \
desktop launcher, a dock icon or a .desktop entry starts VCW from the \
session's environment and not from your shell's, so an `export` in `.bashrc` \
or typed into a terminal is invisible to it. Either start VCW from that same \
terminal, or put the variable somewhere the session reads - `~/.profile` on \
Linux, `launchctl setenv` on macOS, the user environment variables on Windows \
- and log in again."""

["settings.credentials.hint"]
text = """
Read from the environment and never written to a project file. This list is \
everything the application can tell you about one."""

["settings.detection.hint"]
