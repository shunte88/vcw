<!--
  select.svg

  VCW - The Vinyl Capture Workstation
  (c) 2026 Stue Hunter

  The waveform's select cursor: two arrows pointing out of a line, which is
  the gesture - open a stretch out from where you pressed. Drawn on a 24 by 24
  page, the size every platform cursor is, so it sits beside the hand the
  scrub and the ruler scroll use rather than towering over it. The first
  version was 48 across and 14 high, and a cursor three times the width of
  every other cursor on the screen reads as a picture that has come loose.

  tools/make-cursors.sh renders it to the two PNGs the stylesheet asks for, at
  24 and at twice that, because WebKitGTK will not take an SVG for
  `cursor: url()`. The hotspot is the middle of the page, 12 12, which is the
  line between the two arrows.

  White filled and black outlined, which is why it works: the waveform is near
  black and a peak is mid blue, and the drawing has to be legible on both. It
  was checked on both, at 24 and magnified.

  MIT License - see the header in any Rust source file for the full text.
-->

