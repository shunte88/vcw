<!--
  pause.svg

  VCW - The Vinyl Capture Workstation
  (c) 2026 Stue Hunter

  The pause key.

  A key cap rather than a bare glyph, because the transport is the one control
  group a person hits by feel. The cap is #2d3340, one clear step above the
  panel so that it reads as raised, with the inner band along the left and the
  bottom in #13161b, which puts the light at the top right. The glyph is the
  interface text colour, except record, which takes the band red from the logo:
  red is what a record key is on every deck ever made, and it is the only
  saturated thing in the row, so it is also the first thing the eye finds.

  MIT License - see the header in any Rust source file for the full text.
-->
