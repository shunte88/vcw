name: CI

on:
  push:
    branches: [main]
    # A tag is what turns the packaging job into a release. Nothing else does,
    # so a tag is the only thing that publishes anything.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # Weekly, for the packaging jobs: four release builds with a frontend each
  # is too much to put in front of every push, and an installer that stopped
  # building is worth knowing about before a tag rather than during one.
  #
  # Weekly and not nightly since 2026-10-05. This repository is public, so
  # standard runners cost nothing and consume none of the 2,000-minute
  # allowance - every job in it reports `billable.total_ms: 0`. But thirty
  # packaging runs a month across four platforms is still an hour of somebody's
  # hardware a night to learn nothing, and the day the repository goes private
  # that bill arrives at 10x for the macOS leg. Sunday is enough to catch a
  # bundler that stopped working before a tag needs it.
  #
  # §41's endurance soak is not here at all: it runs nightly on media2026,
  # which is idle and ours. `scripts/soak-nightly.cron`, installed in that
  # machine's crontab at 03:17.
  schedule:
    - cron: '0 4 * * 0'

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The product, on every Tier 1 target. aarch64 Linux runs natively rather than
  # cross-compiled: it is the Pi 5 target, and alsa-sys plus bundled SQLite are
  # exactly the dependencies a cross-build gets wrong quietly.
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # A hung test is a six-hour job without this, and the default is no
    # signal at all until it ends: a Windows runner sat in `cargo test` for
    # forty minutes against a five-minute norm with no log to read, because
    # the log blob only appears when the job finishes. Twenty-five minutes is
    # about four times the slowest honest run.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: windows-x86_64, os: windows-latest }
          - { name: macos-aarch64, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      # WP-14's exports are verified by reading them back with somebody else's
      # decoder, and `at_least_one_verifier_is_installed` fails the suite when
      # none is present rather than letting thirteen tests skip in silence.
      # That test was right and these runners were bare, which is why every CI
      # run since the export tests landed has been red.
      - name: Install the third-party export verifiers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y flac ffmpeg
      - name: Install the third-party export verifiers (macOS)
        if: runner.os == 'macOS'
        run: brew install flac ffmpeg
      # ffmpeg alone on Windows: it carries ffprobe, which is all the suite
      # needs, and one package is one thing that can go wrong.
      - name: Install the third-party export verifiers (Windows)
        if: runner.os == 'Windows'
        run: choco install -y ffmpeg
      # `choco install` exits 0 when it installs nothing. On 2026-10-10 the
      # community feed answered 503, choco printed "Chocolatey installed 0/0
      # packages", the step went green, and the failure surfaced four minutes
      # later as `at_least_one_verifier_is_installed` - which is the right test
      # failing for the wrong reason, in the wrong job, a long way from the
      # cause. apt and brew both exit non-zero when a package is missing, so
      # only this one needs saying out loud. A separate step on purpose: choco
      # edits the machine PATH, and the step that ran it does not see the
      # change.
      - name: The Windows verifier is actually installed
        if: runner.os == 'Windows'
        run: ffprobe -version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      # A hosted runner is shared, and two tests in the suite make a latency
      # claim rather than a correctness one. VCW_SHARED=1 is the soak harness's
      # word for "this machine is not ours": the loss assertions still gate, the
      # commit tail is printed instead. The numbers of record come off the rigs.
      - run: cargo test --workspace
        env:
          VCW_SHARED: 1

  # fmt and clippy do not vary by platform, so they run once.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # D10: the MSRV in Cargo.toml is a promise, and an unenforced promise drifts the
  # first time someone uses a newer standard-library method.
  msrv:
    name: msrv 1.90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # D7: license drift is the failure mode this catches. Advisories too, but those
  # are the reason everyone installs it and licenses are the reason we did.
  #
  # The tool is installed rather than run as `EmbarkStudios/cargo-deny-action`,
  # which is a container action: it builds an image from `rust:1.85.0-alpine3.20`
  # on every run, and the shared runner IP pool is over Docker Hub's
  # unauthenticated pull limit. That leg failed twice with `429 Too Many
  # Requests` during the 0.2.1-alpha tag build, both times for a reason with
  # nothing in this repository behind it, and re-running does not help because
  # the next runner draws from the same pool. `install-action` fetches
  # cargo-deny's own prebuilt binary from its GitHub releases, so the only hosts
  # in the path are the ones the checkout already came from.
  #
  # The version is pinned to the one the gate runs, so that `cargo deny check`
  # here and `cargo deny check` on a developer machine are the same check. Bump
  # both together or they stop agreeing.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  # WP-25: the MP3 encoder links libmp3lame under LGPL-3.0, so it sits behind a
  # default-on cargo feature and THIRD-PARTY-NOTICES.md tells a redistributor who
  # cannot carry that obligation to build with `--no-default-features --features
  # ogg`. That is a promise, and a promise nothing builds is a wish: every other
  # job in this file builds the one combination where both features are on, so
  # three of the four would break silently. Linux only and `vcw-export` only -
  # this is about a feature combination, not about a platform.
  export-features:
    name: builds without their optional features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # flac and ffmpeg are not optional here. `cargo test -p vcw-export` runs
      # tests/third_party.rs, every case of which skips itself when its reader
      # is missing - and the guard at the end of that file fails the run rather
      # than let fifteen skipped tests report as fifteen passes.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev flac ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Neither encoder
        run: |
          cargo clippy -p vcw-export --all-targets --no-default-features -- -D warnings
          cargo test -p vcw-export --no-default-features
      - name: MP3 only - the combination a BSD-only redistributor does not want
        run: cargo test -p vcw-export --no-default-features --features mp3
      - name: Ogg only - the escape hatch the notices name
        run: cargo test -p vcw-export --no-default-features --features ogg
      # §52: `vcw serve` is a packaging-time feature for the same reason, less
      # the license. "A capture-only install shall not be listening on
      # anything", so a `vcw` with the listener built out has to compile and
      # pass its tests, and nothing else in this file builds that shape.
      - name: The command line with no listener in it
        run: |
          cargo clippy -p vcw-cli --all-targets --no-default-features -- -D warnings
          cargo test -p vcw-cli --no-default-features

  # §2 is an architectural rule, so it gets a test rather than a code review habit:
  # nothing in crates/ may depend on Tauri, directly or transitively. WP-15 adds the
  # shell under app/, and this job is what stops the shell leaking downward.
  core-is-ui-free:
    name: core has no UI dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Assert no tauri in the core dependency graph
        run: |
          cargo tree --workspace --prefix none --format '{p}' \
            | grep -Eiq '^(tauri|wry|tao|webkit2gtk)( |$)' \
            && { echo "::error::a crate under crates/ depends on the UI shell"; exit 1; } \
            || echo "clean: no tauri, wry, tao or webkit2gtk under crates/"

  # The shell, which is a workspace of its own so that the job above can be a
  # statement about structure rather than a promise about discipline. Linux only:
  # Tauri needs WebKitGTK, and the product's four-target matrix should not have to
  # install it for a crate that is glue.
  shell:
    name: tauri shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shell system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml
      # The frontend first, because `tauri-build` fails the Rust build if
      # `frontendDist` is not there - which is the right failure, and a confusing
      # one to hit from the Rust half of the job.
      - name: Build the frontend
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: app/ui
      # The keyboard map's own tests. `pnpm build` runs `tsc --noEmit` and so
      # proves the frontend compiles against the generated bindings; what it
      # cannot prove is that every chord in the map has a handler behind it,
      # which is WP-16's exit criterion and lives in `wiring.test.ts`.
      - name: Test the frontend
        run: pnpm test
        working-directory: app/ui
      # `tauri-build` refuses to run at all while `bundle.externalBin` names a
      # file that is not there, and WP-19 made it name the CLI. The sidecar is a
      # *packaging* artifact: `tools/stage-cli.sh` builds the real one in the
      # `package` job, which is the job that fails if staging breaks. Checking
      # and testing the shell needs the path to exist, not the binary to work -
      # nothing here executes it - so a placeholder is what this job wants
      # rather than a 10 MB release build of another workspace.
      #
      # This is also why the local gate was green while this job was red: the
      # dev box had a real staged sidecar left over from a package build, so the
      # `appclippy` and `apptest` legs passed on an untracked artifact that no
      # fresh clone has. `gate.sh` now writes the same placeholder.
      - name: Placeholder for the CLI sidecar
        run: |
          mkdir -p app/src-tauri/binaries
          triple=$(rustc -vV | sed -n 's/^host: //p')
          printf 'not the CLI: see tools/stage-cli.sh\n' \
            > "app/src-tauri/binaries/vcw-$triple"
      - name: fmt
        run: cargo fmt --all -- --check
        working-directory: app/src-tauri
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: app/src-tauri
      - name: test
        run: cargo test --workspace
        working-directory: app/src-tauri

  # D9: the committed TypeScript is generated from the Rust types, and this is the
  # job that fails when the two disagree. It is a separate job from `test` because
  # the failure needs its own message: the fix is a regeneration, not a code
  # change, and the four-target matrix would report it four times.
  bindings-are-current:
    name: TypeScript matches Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Assert app/ui/src/bindings/vcw.d.ts is current
        run: cargo test -p vcw-contract --test bindings
      - name: Assert it was not blessed by accident
        run: |
          git diff --exit-code -- app/ui/src/bindings/ \
            || { echo "::error::the bindings changed during the test run"; exit 1; }

  # The Phase 0 spikes are their own workspace and are not shipped, but the numbers
  # in docs/spikes/ are only reproducible while they still compile. Linux only -
  # tauri-ipc-bench needs WebKitGTK, and there is nothing to learn from building it
  # anywhere else.
  spikes:
    name: spikes still compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install spike system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes
      # `tauri::generate_context!` resolves frontendDist at compile time and
      # panics if the directory is absent. The spike's `dist/` is a build
      # artifact and gitignored, so it exists on the machine that built it and
      # nowhere else - which is why this job has never passed on a clean
      # checkout. A placeholder is enough: nothing here runs the window.
      - name: Give the IPC spike a frontendDist to point at
        run: |
          mkdir -p spikes/tauri-ipc-bench/dist
          [ -f spikes/tauri-ipc-bench/dist/index.html ] || \
            echo '<!doctype html><title>placeholder</title>' \
              > spikes/tauri-ipc-bench/dist/index.html
      - run: cargo check --workspace --all-targets
        working-directory: spikes

  # WP-17, §41. The soak harness does not run here any more, short leg or long.
  #
  # The long leg never did: a hosted runner shares its CPU and its disk, and
  # the one time it ran it dropped 25,920 frames and failed the byte verifier
  # on the neighbors' account rather than on ours. The short leg did, on every
  # push, for up to thirty minutes of runner time - and it was measuring the
  # same shared machine, so it could gate loss but never latency.
  #
  # Both now run on media2026, which is idle and ours, out of
  # `scripts/soak-nightly.cron` at 03:17 with its logs under /data2/vcw-soak.
  # The latency gates are on there, because on that machine they mean
  # something. See docs/STATUS.md.

  # WP-19. Installable artifacts for every Tier 1 platform, their checksums, and
  # on a tag, a release with all of it attached.
  #
  # Not on every push: four release builds with a frontend each is twenty
  # minutes of runner time to prove something that only matters when a version
  # is going out. Tags, the weekly schedule, and a manual run.
  package:
    name: package (${{ matrix.name }})
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, bundles: 'deb,appimage' }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, bundles: 'deb,appimage' }
          - { name: windows-x86_64, os: windows-latest, bundles: 'msi' }
          - { name: macos-aarch64, os: macos-latest, bundles: 'app,dmg' }
    steps:
      - uses: actions/checkout@v4
      # The same webkit and gtk headers the shell job needs, plus ALSA, plus
      # librsvg because the deb's icons are rendered at bundle time.
      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: package-${{ matrix.name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml
      - name: Install the tauri CLI
        run: cargo install tauri-cli --locked --version '^2.11'
      - name: Build the frontend
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: app/ui

      # Signing, and the rule for it: the secrets come from the repository and
      # nothing is ever read from a project file or written into one (§39). When
      # a secret is absent the build carries on and produces an unsigned
      # artifact, because a release that cannot be built without a certificate
      # is a release nobody can reproduce. What it must not do is produce an
      # unsigned artifact quietly, so both branches say which happened.
      - name: Decide whether this build can be signed (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "### macOS bundle will be signed and notarised" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### macOS bundle is UNSIGNED: no APPLE_CERTIFICATE secret" >> "$GITHUB_STEP_SUMMARY"
            echo "Gatekeeper will refuse it until it is signed." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The CLI travels inside the package: every workflow in USER-GUIDE.md is a
      # `vcw ...` line, and `vcw bundle` is what a person is asked to send when
      # something breaks. The bundler will not start without the sidecar the
      # config names, so a failure here is loud.
      - name: Stage the CLI beside the shell
        shell: bash
        run: bash tools/stage-cli.sh

      - name: Build the bundles
        run: cargo tauri build --bundles ${{ matrix.bundles }} --verbose
        working-directory: app/src-tauri
        env:
          # The updater's signing key, which tauri uses only if it is set.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Authenticode, after the fact rather than through the config, so the
      # absence of a certificate is a step that does not run rather than a
      # build that fails.
      - name: Sign the installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$WINDOWS_CERTIFICATE" ]; then
            echo "### Windows installer is UNSIGNED: no WINDOWS_CERTIFICATE secret" >> "$GITHUB_STEP_SUMMARY"
            echo "SmartScreen will warn about it until it is signed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
          signtool=$(find "/c/Program Files (x86)/Windows Kits/10/bin" -name signtool.exe \
            -path '*x64*' | sort | tail -1)
          for installer in app/target/release/bundle/msi/*.msi; do
            "$signtool" sign /f "$RUNNER_TEMP/cert.pfx" \
              /p "$WINDOWS_CERTIFICATE_PASSWORD" \
              /fd sha256 /tr http://timestamp.digicert.com /td sha256 "$installer"
          done
          rm -f "$RUNNER_TEMP/cert.pfx"
          echo "### Windows installer signed" >> "$GITHUB_STEP_SUMMARY"

      # Collect what was built into one flat directory and check it is not
      # empty. An empty artifact upload is a green job that shipped nothing, and
      # `if-no-files-found: error` catches it a step too late to say why.
      - name: Collect the artifacts
        shell: bash
        run: |
          mkdir -p dist
          find app/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' \
               -o -name '*.dmg' -o -name '*.sig' \) \
            -exec cp {} dist/ \;
          # The .app is a directory, so it travels as a tarball or not at all.
          for app in app/target/release/bundle/macos/*.app; do
            [ -d "$app" ] || continue
            tar -czf "dist/$(basename "$app" .app)-macos-aarch64.app.tar.gz" \
              -C "$(dirname "$app")" "$(basename "$app")"
          done
          ls -la dist
          [ -n "$(ls -A dist)" ] || { echo "::error::nothing was bundled"; exit 1; }

      - name: Write the checksums
        shell: bash
        run: python3 tools/verify-release.py --write dist/SHA256SUMS

      # And check them with the same tool a person downloading them will use,
      # here, where a mistake in the tool is still cheap.
      - name: Check them back
        shell: bash
        run: python3 tools/verify-release.py dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: vcw-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # The release itself. Only ever from a tag, and only after every platform has
  # produced something, because a partial release is worse than a late one.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staged
      - name: Gather every platform's artifacts and merge the checksums
        run: |
          mkdir -p dist
          find staged -type f ! -name SHA256SUMS -exec cp {} dist/ \;
          # Rewritten rather than concatenated: one tool, one format, and a
          # digest recomputed here cannot disagree with the bytes being
          # attached to the release.
          python3 tools/verify-release.py --write dist/SHA256SUMS
          python3 tools/verify-release.py dist/SHA256SUMS
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The version's own section if the changelog has one, and
          # `## Unreleased` only if it does not: a tag cut before that section
          # is renamed should still carry its notes, and a tag cut after it
          # must not carry them twice.
          section() {
            awk -v want="## $1" '
              $0 ~ "^## " { keep = ($0 == want) }
              keep { print }
            ' CHANGELOG.md
          }
          section "$version" > notes.md
          [ -s notes.md ] && from="the $version section" || from="the Unreleased section"
          [ -s notes.md ] || section Unreleased > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $version and no Unreleased section"; exit 1; }
          echo "### Release notes taken from $from of CHANGELOG.md" >> "$GITHUB_STEP_SUMMARY"
          cat >> notes.md <<'NOTE'

          ## Verifying what you downloaded

          Download `SHA256SUMS` beside the artifacts and run:

          ```text
          python3 tools/verify-release.py SHA256SUMS
          ```

          or, if you already have coreutils, `sha256sum -c SHA256SUMS`. Either
          one tells you the bytes are intact. Neither tells you who built them.
          NOTE
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          draft: true
